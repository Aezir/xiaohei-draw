<div class="inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b>小黑生图</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
  </div>
  <div class="inline-drawer-content">
    <div class="xbdraw-settings">
      <label class="xbdraw-item" for="xbdraw_enabled">
        <i class="ri-flashlight-line xbdraw-item-icon"></i>
        <span class="xbdraw-item-text">
          <span class="xbdraw-item-title">启用小黑生图</span>
          <span class="xbdraw-item-desc">关掉后不再配图，已有图片照常显示</span>
        </span>
        <input type="checkbox" id="xbdraw_enabled" class="xbdraw-switch" />
      </label>

      <div class="xbdraw-item">
        <i class="ri-refresh-line xbdraw-item-icon"></i>
        <span class="xbdraw-item-text">
          <span class="xbdraw-item-title">检查更新</span>
          <span class="xbdraw-item-desc" id="xbdraw_update_status">从 GitHub 拉取最新版</span>
        </span>
        <button id="xbdraw_check_update" class="xbdraw-btn" type="button"><span>检查</span></button>
      </div>

      <button id="xbdraw_open_settings" class="xbdraw-item xbdraw-item-action" type="button">
        <i class="ri-palette-line xbdraw-item-icon"></i>
        <span class="xbdraw-item-text">
          <span class="xbdraw-item-title">画图设置</span>
          <span class="xbdraw-item-desc">参数、角色、提示词、API、图片管理</span>
        </span>
        <i class="ri-arrow-right-s-line xbdraw-item-arrow"></i>
      </button>

      <div class="xbdraw-footnote">Based on LittleWhiteBox by biex</div>
    </div>
  </div>
</div>
