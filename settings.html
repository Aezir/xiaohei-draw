<div class="inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b>小黑生图</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
  </div>
  <div class="inline-drawer-content">
    <div class="xbdraw-settings">
      <div class="xbdraw-row">
        <input type="checkbox" id="xbdraw_enabled" />
        <label for="xbdraw_enabled">启用小黑生图</label>
      </div>
      <div class="xbdraw-row">
        <label for="xbdraw_provider">画图后端</label>
        <select id="xbdraw_provider" class="text_pole">
          <option value="disabled">关闭</option>
          <option value="novelai">NovelAI</option>
        </select>
        <button id="xbdraw_open_settings" class="menu_button menu_button_icon" type="button" title="打开画图详细设置">
          <i class="ri-palette-line"></i>
          <small>画图设置</small>
        </button>
      </div>
      <small>Based on LittleWhiteBox by biex</small>
    </div>
  </div>
</div>
